<button
  [type]="type"
  [disabled]="disabled"
  [ngClass]="{
    'bg-primary text-principal hover:bg-primaryHover active:bg-primaryActive': variant === 'primary',
    'text-text disabled:bg-principal disabled:text-text hover:bg-raised active:bg-principal active:text-primary active:transition-all active:duration-75 ':
      variant === 'secondary',
    'w-full': fullWidth,
  }"
  class="inline-flex items-center justify-center rounded-controls px-lg py-md font-sans font-semibold transition-colors duration-200 disabled:cursor-not-allowed disabled:opacity-50 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary focus-visible:ring-offset-2 focus-visible:ring-offset-principal">
  <ng-content></ng-content>
</button>
